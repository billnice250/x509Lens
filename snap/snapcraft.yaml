name: x509-lens
base: core24
version: '1.0.0'
summary: Inspect X.509 certificates and cryptographic objects
description: |
  X509 Lens inspects certificates, chains, CSRs, CRLs, PKCS#7 and PKCS#12
  bundles, and public key metadata. It can compare a TLS server's presented
  chain with paths resolved through the host trust store.
grade: stable
confinement: strict

apps:
  x509-lens:
    command: usr/bin/x509lens
    desktop: usr/share/applications/io.github.billnice250.X509Lens.desktop
    extensions: [gnome]
    plugs: [home, network, network-bind, removable-media]

parts:
  x509-lens:
    plugin: nil
    source: .
    build-packages:
      - gcc
      - golang-go
      - libgtk-3-dev
      - libwebkit2gtk-4.1-dev
      - pkg-config
    override-build: |
      go run scripts/make-icon.go
      go run github.com/wailsapp/wails/v2/cmd/wails@v2.17.0 build -s -skipbindings -m -trimpath -platform "linux/$(go env GOARCH)" -tags desktop,webkit2_41
      install -Dm755 build/bin/X509Lens "$CRAFT_PART_INSTALL/usr/bin/x509lens"
      install -Dm644 packaging/linux/io.github.billnice250.X509Lens.desktop "$CRAFT_PART_INSTALL/usr/share/applications/io.github.billnice250.X509Lens.desktop"
      install -Dm644 packaging/linux/io.github.billnice250.X509Lens.metainfo.xml "$CRAFT_PART_INSTALL/usr/share/metainfo/io.github.billnice250.X509Lens.metainfo.xml"
      install -Dm644 build/appicon.png "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/1024x1024/apps/io.github.billnice250.X509Lens.png"
